name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-{0}', github.ref) || format('tests-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Horizon ${{ matrix.horizon }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            laravel: '13.23 minimum / Horizon 5.46 minimum'
            framework: '13.23.0'
            horizon: '5.46.0'
            pest: '5.0.4'
            pest_browser: '5.0.1'
            pest_plugin_laravel: '5.0.1'
            testbench: '11.2.0'
            without-boost: true
          - php: '8.5'
            laravel: '13.25 (pause-all enabled)'
            framework: '13.25.0'
            horizon: '5.46.0'
            pest: '^5.0'
            pest_browser: '^5.0'
            pest_plugin_laravel: '^5.0'
            testbench: '^11.1'
            without-boost: true
          - php: '8.5'
            laravel: '13 latest / Horizon 5.46 minimum'
            framework: '^13.23'
            horizon: '5.46.0'
            pest: '^5.0'
            pest_browser: '^5.0'
            pest_plugin_laravel: '^5.0'
            testbench: '^11.1'
            without-boost: false
          - php: '8.5'
            laravel: '13 latest / latest Horizon'
            framework: '^13.23'
            horizon: '^5.46.0'
            pest: '^5.0'
            pest_browser: '^5.0'
            pest_plugin_laravel: '^5.0'
            testbench: '^11.1'
            without-boost: false

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Remove development packages that narrow the boundary
        if: matrix.without-boost
        run: composer remove --dev laravel/boost --no-interaction --no-update

      - name: Select Laravel version
        run: |
          composer require "laravel/framework:${{ matrix.framework }}" --no-interaction --no-update
          composer require "laravel/horizon:${{ matrix.horizon }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer require --dev "pestphp/pest:${{ matrix.pest }}" --no-interaction --no-update
          composer require --dev "pestphp/pest-plugin-browser:${{ matrix.pest_browser }}" --no-interaction --no-update
          composer require --dev "pestphp/pest-plugin-laravel:${{ matrix.pest_plugin_laravel }}" --no-interaction --no-update

      - name: Install Composer dependencies
        run: composer update --with-all-dependencies --no-security-blocking --no-interaction --no-progress --prefer-dist

      - name: Show resolved compatibility versions
        run: php -r 'require "vendor/autoload.php"; echo PHP_VERSION, " Laravel ", Composer\InstalledVersions::getPrettyVersion("laravel/framework"), " Horizon ", Composer\InstalledVersions::getPrettyVersion("laravel/horizon"), PHP_EOL;'

      - name: Test PHP compatibility
        run: composer test

      - name: Smoke-test a real Horizon worker
        env:
          HORIZON_COMPATIBILITY_REDIS_DB: 15
          HORIZON_COMPATIBILITY_REDIS_HOST: 127.0.0.1
          HORIZON_COMPATIBILITY_REDIS_PORT: 6379
        run: composer test:compatibility

  retained-job-redis:
    name: Retained jobs / ${{ matrix.server }} / ${{ matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: ${{ matrix.server }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        server:
          - redis:6.2-alpine
          - redis:7-alpine
          - valkey/valkey:8-alpine
        client:
          - Predis
          - PhpRedis
        include:
          - server: redis:7-alpine
            client: Predis 2
            predis: '^2.3'

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          extensions: redis

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Select Predis version
        if: matrix.predis
        run: composer require --dev "predis/predis:${{ matrix.predis }}" --with-all-dependencies --no-interaction --no-progress

      - name: Test retained jobs against real Redis
        env:
          HORIZON_COMPATIBILITY_REDIS_CLIENT: ${{ matrix.client == 'PhpRedis' && 'phpredis' || 'predis' }}
          HORIZON_COMPATIBILITY_REDIS_DB: 15
          HORIZON_COMPATIBILITY_REDIS_HOST: 127.0.0.1
          HORIZON_COMPATIBILITY_REDIS_PORT: 6379
        run: vendor/bin/pest tests/Compatibility/RetainedJobRedisCompatibilityTest.php

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Audit frontend dependencies
        run: bun audit

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Composer package metadata
        run: composer validate --strict

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Verify PHP
        run: composer quality

      - name: Verify frontend formatting
        run: bun run format:check

      - name: Lint frontend
        run: bun run lint

      - name: Test frontend
        run: bun run test

      - name: Type-check frontend
        run: bun run typecheck

      - name: Verify generated assets
        run: git diff --exit-code -- dist/build resources/js/generated

  ci:
    name: CI
    if: always()
    needs:
      - compatibility
      - retained-job-redis
      - audit
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "A required job finished with: $result" >&2
              exit 1
            fi
          done


  auto-merge:
    name: Auto Merge
    needs:
      - ci
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enable auto-merge (merge commit)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::GH_PAT is not available to this repository; enable auto-merge on the pull request manually."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch --auto
